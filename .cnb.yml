# CNB build pipeline for Codex Desktop (Tauri 2).
#
# Current status: only the Linux build runs on the official CNB Linux runner
# (containerized, codex-desktop/.cnb/Dockerfile). The Windows (tags: [win]) and
# macOS (tags: [mac]) self-hosted pipelines are intentionally NOT included yet
# because those build nodes are not connected. Add them back once the nodes are
# provisioned.
#
# When enabled, the Windows/macOS pipelines run on self-hosted build nodes (no
# Docker build env) on the host toolchain directly. Those nodes must pre-install:
# Rust 1.95.0 (from codex-rs/rust-toolchain.toml), Node.js >=22 and pnpm 10.33
# (from root package.json), plus the platform bundler toolchain (Windows: MSVC +
# NSIS/WiX; macOS: Xcode Command Line Tools).
#
# Modeled on the repo's GitHub Actions workflows (rust-ci / rust-ci-full / sdk):
#   - cargo fmt --check, cargo clippy -- -D warnings, cargo test
#   - pnpm install --frozen-lockfile + pnpm build for the React/Vite ui/

# Shared frontend build step (works in bash on Linux/macOS and PowerShell on Windows)
.x-frontend-build: &x-frontend-build
  name: frontend-build
  script: |
    cd codex-desktop/ui
    pnpm install --frozen-lockfile
    pnpm build

"feat/codex-desktop":
  push:
    # ---- Linux desktop bundle (official CNB Linux runner) ----
    - name: codex-desktop-linux
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: codex-desktop/.cnb/Dockerfile
          by:
            - codex-desktop/.cnb/Dockerfile
            - codex-rs/rust-toolchain.toml
            - package.json
            - pnpm-lock.yaml
      services:
        - docker
      stages:
        - name: fmt-check
          script: |
            cd codex-rs
            cargo fmt -- --config imports_granularity=Item --check
        - *x-frontend-build
        - name: clippy
          script: |
            cd codex-rs
            cargo clippy -p codex-desktop --all-targets -- -D warnings
        - name: test
          script: |
            cd codex-rs
            cargo test -p codex-desktop
        - name: tauri-build
          # Wrap `cargo tauri build` in a heartbeat loop: the release build of
          # codex-desktop links the full codex workspace (~19 min) and can go
          # silent for >10 min during linking, which trips CNB's no-output
          # watchdog. The wrapper emits a heartbeat every 2 min to keep the
          # stage alive.
          script: |
            cd codex-desktop
            chmod +x .cnb/heartbeat.sh
            HEARTBEAT_INTERVAL=120 ./.cnb/heartbeat.sh cargo tauri build

  pull_request:
    # ---- PR checks (official CNB Linux runner) ----
    - name: codex-desktop-pr
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: codex-desktop/.cnb/Dockerfile
          by:
            - codex-desktop/.cnb/Dockerfile
            - codex-rs/rust-toolchain.toml
            - package.json
            - pnpm-lock.yaml
      services:
        - docker
      stages:
        - name: fmt-check
          script: |
            cd codex-rs
            cargo fmt -- --config imports_granularity=Item --check
        - *x-frontend-build
        - name: clippy
          script: |
            cd codex-rs
            cargo clippy -p codex-desktop --all-targets -- -D warnings
        - name: test
          script: |
            cd codex-rs
            cargo test -p codex-desktop
